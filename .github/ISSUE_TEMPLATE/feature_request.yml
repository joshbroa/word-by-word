name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: Describe the situation or problem. For example, "When I copy recipes, I ..."
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: What would help?
          description: How you imagine it working.
    - type: textarea
      id: alternatives
      attributes:
          label: Anything else?
          description: Workarounds you've tried, similar tools, screenshots.
